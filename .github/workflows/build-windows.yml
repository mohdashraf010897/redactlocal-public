name: Build Windows Desktop App (MSI & NSIS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src-tauri/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Prepare Frontend Dist Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item index.html, studio.html, manifest.webmanifest, icon.svg, sw.js -Destination dist/ -Force
          if (Test-Path vendor) {
            Copy-Item vendor -Destination dist/vendor -Recurse -Force
          }
          if (Test-Path redaction-test-lab) {
            Copy-Item redaction-test-lab -Destination dist/redaction-test-lab -Recurse -Force
          }
          Get-ChildItem dist

      - name: Build Windows Installers (MSI & NSIS)
        shell: pwsh
        run: |
          cd src-tauri
          npx tauri build

      - name: Upload Windows MSI & NSIS Installers
        uses: actions/upload-artifact@v4
        with:
          name: RedactLocal-Windows-Installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      - name: Attach Windows Installers to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi","target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe","target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "Found MSI: $($msi.FullName)"
            gh release upload v1.0.1 $msi.FullName --clobber
          }
          if ($nsis) {
            Write-Host "Found NSIS: $($nsis.FullName)"
            gh release upload v1.0.1 $nsis.FullName --clobber
          }

